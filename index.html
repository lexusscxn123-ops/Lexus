<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE TRINITY // VOID</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        /* Yağmur ve Sis Efekti */
        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.2; pointer-events: none; }
        .vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; box-shadow: inset 0 0 200px #000; z-index: 2; pointer-events: none; }

        .content { z-index: 3; text-align: center; }

        /* İsimlerin Stili */
        .names { margin-bottom: 50px; }
        .name-item { font-size: 45px; letter-spacing: 25px; font-weight: 100; color: #fff; margin: 20px 0; display: block; text-transform: uppercase; transition: 1.5s; opacity: 0.6; cursor: default; }
        .name-item:hover { opacity: 1; letter-spacing: 35px; text-shadow: 0 0 30px rgba(255,255,255,0.4); }

        /* Alt Başlık */
        .sub { font-size: 10px; letter-spacing: 15px; color: #333; text-transform: uppercase; margin-top: 50px; }

        /* Gizli Müzik */
        #yt-player { position: absolute; top: -999px; }
        
        /* Tıkla Mesajı */
        .click-anywhere { position: fixed; bottom: 30px; font-size: 9px; color: #111; letter-spacing: 5px; text-transform: uppercase; }
    </style>
</head>
<body onclick="start()">

<canvas id="canvas"></canvas>
<div class="vignette"></div>

<div class="content">
    <div class="names">
        <span class="name-item">LEXUS</span>
        <span class="name-item">JINX</span>
        <span class="name-item">erc4c3n</span>
    </div>
    <div class="sub">SINCE 2018 // THE CORE</div>
</div>

<div class="click-anywhere">EKRANA DOKUN VE AFFET...</div>

<iframe id="yt-player" width="0" height="0" src="" frameborder="0" allow="autoplay"></iframe>

<script>
    function start() {
        const player = document.getElementById('yt-player');
        if(!player.src) {
            // Müslüm Gürses - Affet şarkısı
            player.src = "https://www.youtube.com/embed/bKJyG_BGFso?autoplay=1&loop=1&playlist=bKJyG_BGFso";
            document.querySelector('.click-anywhere').style.display = 'none';
        }
    }

    // Yağmur Animasyonu
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const particles = [];
    for(let i=0; i<100; i++) particles.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, l: Math.random()*30, v: Math.random()*4+2});
    
    function rain() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle = "rgba(255,255,255,0.5)";
        ctx.lineWidth = 1;
        particles.forEach(p => {
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y+p.l); ctx.stroke();
            p.y += p.v; if(p.y > canvas.height) p.y = -p.l;
        });
        requestAnimationFrame(rain);
    }
    rain();
</script>
</body>
</html>
