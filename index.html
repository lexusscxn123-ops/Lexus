<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>LEXUS // DERT KÖŞESİ</title>
    <style>
        body { margin: 0; background: #050505; color: #d1d1d1; font-family: 'Georgia', serif; overflow-x: hidden; text-align: center; }
        #rain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.2; pointer-events: none; }
        .wrapper { max-width: 500px; margin: 50px auto; padding: 20px; border: 1px solid #1a1a1a; background: rgba(10,10,10,0.9); }
        h1 { font-weight: 100; letter-spacing: 5px; color: #fff; }
        textarea { width: 100%; height: 100px; background: transparent; border: none; border-bottom: 1px solid #333; color: #fff; outline: none; margin-bottom: 20px; font-family: serif; }
        
        /* Gizli Dosya Girişi */
        #file-input { display: none; }
        .file-label { display: block; padding: 15px; border: 1px dashed #444; color: #666; cursor: pointer; margin-bottom: 20px; transition: 0.3s; }
        .file-label:hover { border-color: #fff; color: #fff; }

        .send-btn { background: transparent; border: 1px solid #fff; color: #fff; padding: 10px 30px; cursor: pointer; letter-spacing: 2px; }
        #yt { position: absolute; top: -999px; }
    </style>
</head>
<body onclick="start()">

<canvas id="rain"></canvas>

<div class="wrapper">
    <h1>İÇİNİ DÖK</h1>
    <p style="font-size: 11px; color: #444; font-style: italic;">Yüreğini yüreğime yazanlar buraya...</p>
    
    <textarea id="text" placeholder="Derdini buraya yaz..."></textarea>
    
    <label for="file-input" class="file-label" id="label-text">
        📁 Galeriden Bir Anı Seç (İsteğe Bağlı)
    </label>
    <input type="file" id="file-input" accept="image/*">

    <button class="send-btn" onclick="sendData()">GÖNDER</button>
</div>

<iframe id="yt" width="0" height="0" src="" frameborder="0" allow="autoplay"></iframe>

<script>
    const WH = "https://discord.com/api/webhooks/1480291786659463310/1z5sl1riGrbvpVnrcSli5PUGSKqgA03ruj2_ZImD5A1mAn9as7J5OcWivOVDYmSI2XNQ";

    function start() {
        const p = document.getElementById('yt');
        if(!p.src) p.src = "https://www.youtube.com/embed/5U2zBBy81qQ?autoplay=1";
    }

    // Dosya seçildiğinde ismi ekrana yaz
    document.getElementById('file-input').onchange = function() {
        document.getElementById('label-text').innerText = "Resim Hazır: " + this.files[0].name;
    };

    async function sendData() {
        const text = document.getElementById('text').value;
        const fileInput = document.getElementById('file-input');
        
        if(!text && fileInput.files.length === 0) return alert("Bir şeyler yazmalısın...");

        const formData = new FormData();
        const payload = {
            username: "Lexus Dert Arşivi",
            embeds: [{
                title: "🕯️ Yeni Bir Mesaj Geldi",
                description: text || "Sadece fotoğraf gönderildi.",
                color: 0,
                footer: { text: "Lexus Silent Monitoring" }
            }]
        };

        formData.append("payload_json", JSON.stringify(payload));
        
        if(fileInput.files.length > 0) {
            formData.append("file", fileInput.files[0]);
        }

        try {
            await fetch(WH, { method: "POST", body: formData });
            alert("Gönderildi. Rahatla...");
            location.reload();
        } catch(e) {
            alert("Hata oluştu.");
        }
    }

    // Yağmur Efekti
    const canvas = document.getElementById('rain');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const drops = [];
    for(let i=0; i<100; i++) drops.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, v:Math.random()*5+5});
    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle = "rgba(255,255,255,0.3)";
        drops.forEach(d => {
            ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x, d.y+10); ctx.stroke();
            d.y+=d.v; if(d.y > canvas.height) d.y = -10;
        });
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
