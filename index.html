<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEXUS OSINT v11.0 - DYNAMIC DATABASE</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: #8A2BE2; }
        canvas { display: block; position: fixed; top: 0; left: 0; z-index: -1; }
        
        #login-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(10, 10, 10, 0.98); padding: 35px; border: 2px solid #8A2BE2;
            border-radius: 10px; box-shadow: 0 0 25px #8A2BE2; text-align: center; width: 300px;
        }

        #terminal-screen {
            display: none; position: absolute; top: 2%; left: 2%; width: 96%; height: 96%;
            background: rgba(10, 10, 10, 0.97); border: 1px solid #8A2BE2; padding: 25px;
            box-sizing: border-box; overflow-y: auto; border-radius: 8px;
        }

        .result-container { margin-top: 25px; display: none; border: 1px solid #8A2BE2; background: rgba(138, 43, 226, 0.05); padding: 20px; animation: fadeIn 0.4s; }
        
        .section-title { color: #fff; font-weight: bold; border-bottom: 1px solid #8A2BE2; padding-bottom: 8px; margin: 15px 0 10px 0; text-transform: uppercase; font-size: 13px; }
        .data-row { margin: 12px 0; font-size: 14px; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(138, 43, 226, 0.1); padding-bottom: 5px; }
        .key-label { color: #8A2BE2; font-weight: bold; }
        .val-text { color: #00ff00; font-weight: bold; word-break: break-all; text-align: right; width: 65%; }

        input, button {
            width: 100%; padding: 12px; margin: 10px 0; background: #000;
            border: 1px solid #8A2BE2; color: #fff; outline: none; border-radius: 4px;
        }
        button { background: #8A2BE2; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button:hover { background: #fff; color: #8A2BE2; box-shadow: 0 0 20px #fff; }

        .terminal-log { color: #555; font-size: 11px; margin: 2px 0; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="login-screen">
    <h2 style="letter-spacing: 10px; color: #8A2BE2;">LEXUS</h2>
    <p style="font-size: 10px; color: #444;">OSINT INTERFACE V11.0</p>
    <input type="password" id="passkey" placeholder="ACCESS KEY">
    <button onclick="authorize()">SİSTEME GİRİŞ</button>
</div>

<div id="terminal-screen">
    <div style="border-bottom: 2px solid #8A2BE2; padding-bottom: 15px; margin-bottom: 20px;">
        <h2 style="margin:0; letter-spacing: 4px;">LEXUS INTELLIGENCE SUITE</h2>
        <p style="font-size: 11px; margin: 5px 0;">[OPERATOR: lexusscxn] | [SORGULAMA MODU: DİNAMİK]</p>
    </div>

    <input type="text" id="targetId" placeholder="Sorgulanacak ID veya Veri Girin...">
    <button onclick="startDeepSearch()">VERİTABANINDA SORGULA</button>

    <div id="logs" style="margin-top: 15px; max-height: 80px; overflow: hidden;"></div>

    <div id="resultBox" class="result-container">
        <div class="section-title">Kullanıcı Kimlik Bilgileri</div>
        <div class="data-row"><span class="key-label">HEDEF ID:</span><span class="val-text" id="disp-id"></span></div>
        <div class="data-row"><span class="key-label">E-POSTA:</span><span class="val-text" id="disp-email"></span></div>
        
        <div class="section-title">Ağ ve Lokasyon Analizi</div>
        <div class="data-row"><span class="key-label">IP ADRESİ:</span><span class="val-text" id="disp-ip"></span></div>
        <div class="data-row"><span class="key-label">SAĞLAYICI:</span><span class="val-text">Turk Telekom (Residential)</span></div>
        
        <div class="section-title">Sosyal Veriler</div>
        <div class="data-row"><span class="key-label">BULUNDUĞU SUNUCULAR:</span><span class="val-text">112948... , 992031...</span></div>
    </div>
</div>

<script>
    const ADMIN_PASS = "lexusscxn";
    const USER_PASS = "lexus2026";

    // --- BU BÖLÜM SENİN VERİTABANIN ---
    // Her ID için farklı e-posta ve IP buraya girilir.
    const dataRecords = {
        "1338919878265933948": {
            email: "lexuscxn2026@gmail.com",
            ip: "176.232.146.180"
        },
        "5588339944": {
            email: "hidayet_oz@outlook.com",
            ip: "185.12.99.44"
        },
        "7744112255": {
            email: "target_user_99@protonmail.com",
            ip: "95.10.20.30"
        }
    };

    function authorize() {
        const val = document.getElementById('passkey').value;
        if(val === ADMIN_PASS || val === USER_PASS) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('terminal-screen').style.display = 'block';
        } else { alert("YETKİSİZ ERİŞİM!"); }
    }

    function addLog(txt) {
        const l = document.getElementById('logs');
        const p = document.createElement('p');
        p.className = 'terminal-log';
        p.innerText = ">> " + txt;
        l.prepend(p);
    }

    function startDeepSearch() {
        const id = document.getElementById('targetId').value.trim();
        if(!id) return;

        document.getElementById('resultBox').style.display = 'none';
        document.getElementById('logs').innerHTML = "";

        addLog("Derin tarama motoru başlatıldı...");
        setTimeout(() => addLog("SQL/JSON veritabanları taranıyor (Gizli Mod)..."), 600);
        setTimeout(() => addLog("Eşleşen kimlik verileri doğrulanıyor..."), 1300);

        setTimeout(() => {
            if (dataRecords[id]) {
                const res = dataRecords[id];
                document.getElementById('disp-id').innerText = id;
                document.getElementById('disp-email').innerText = res.email; // ID'ye ait e-postayı getirir
                document.getElementById('disp-ip').innerText = res.ip; // ID'ye ait IP'yi getirir
                
                document.getElementById('resultBox').style.display = 'block';
                addLog("VERİ BULUNDU: Rapor oluşturuldu.");
            } else {
                addLog("HATA: Bu ID'ye ait bir kayıt bulunamadı.");
                alert("Veritabanında bu ID ile eşleşen bir veri yok.");
            }
        }, 2000);
    }

    // Matrix Background
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const chars = "LEXUS01";
    const drops = Array(Math.floor(canvas.width/16)).fill(1);
    function draw() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#8A2BE2";
        drops.forEach((y, i) => {
            ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*16, y*16);
            if(y*16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(draw, 33);
</script>
</body>
</html>
