<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEXUS // TRINITY</title>
    <style>
        :root { --glow: #ffffff; }
        body { margin: 0; background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; user-select: none; }
        
        /* Arka Plan Hareketli Parçacıklar */
        #particles-js { position: fixed; width: 100%; height: 100%; z-index: 1; }
        .vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; box-shadow: inset 0 0 300px #000; z-index: 2; pointer-events: none; }

        .container { z-index: 10; text-align: center; }

        /* Agresif İsim Tasarımı */
        .trinity-wrap { margin-bottom: 40px; }
        .name { 
            font-size: 65px; letter-spacing: 20px; font-weight: 900; display: block; 
            margin: 5px 0; color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,0.3);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: crosshair;
        }
        .name:hover { 
            color: #fff; -webkit-text-stroke: 1px #fff; letter-spacing: 35px;
            text-shadow: 0 0 50px var(--glow);
        }

        /* Sosyal Linkler - Modern Bar */
        .link-bar { display: flex; justify-content: center; gap: 30px; margin-top: 40px; }
        .link-bar a { 
            color: #444; text-decoration: none; font-size: 11px; letter-spacing: 5px; 
            text-transform: uppercase; transition: 0.4s; padding: 10px 20px; border: 1px solid #111;
        }
        .link-bar a:hover { color: #fff; border-color: #fff; background: rgba(255,255,255,0.05); box-shadow: 0 0 20px rgba(255,255,255,0.1); }

        /* Shake Animasyonu (Müzik Başlayınca Tetiklenebilir) */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .bass-active { animation: shake 0.5s infinite; }

        #yt-player { position: absolute; top: -999px; }
        .entry-btn { color: #222; font-size: 10px; letter-spacing: 10px; cursor: pointer; transition: 0.3s; }
        .entry-btn:hover { color: #fff; }
    </style>
</head>
<body onclick="launch()">

<div id="particles-js"></div>
<div class="vignette"></div>

<div class="container" id="main-ui">
    <div class="entry-btn" id="start-txt">SİSTEME GİRİŞ YAP</div>
    
    <div class="trinity-wrap" style="display:none;" id="content-area">
        <span class="name">LEXUS</span>
        <span class="name">JINX</span>
        <span class="name">erc4c3n</span>

        <div class="link-bar">
            <a href="https://discord.com/users/e.okul" target="_blank">Discord</a>
            <a href="https://www.tiktok.com/@lexuscxnnn" target="_blank">TikTok</a>
            <a href="https://open.spotify.com/user/spotify_linkin" target="_blank">Spotify</a>
        </div>
        <p style="font-size: 9px; color: #111; letter-spacing: 8px; margin-top: 50px;">EST. 2018 // THE UNTOUCHABLES</p>
    </div>
</div>

<iframe id="yt-player" width="0" height="0" src="" frameborder="0" allow="autoplay"></iframe>

<script>
    function launch() {
        const startTxt = document.getElementById('start-txt');
        const contentArea = document.getElementById('content-area');
        const player = document.getElementById('yt-player');
        const body = document.querySelector('.container');

        if(startTxt.style.display !== 'none') {
            startTxt.style.display = 'none';
            contentArea.style.display = 'block';
            player.src = "https://www.youtube.com/embed/xbr5sV68laE?autoplay=1&loop=1&playlist=xbr5sV68laE";
            
            // Bas hissi için ekranı hafif sars (opsiyonel)
            body.classList.add('bass-active');
            setTimeout(() => body.classList.remove('bass-active'), 5000);
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
    particlesJS("particles-js", {
        "particles": {
            "number": { "value": 80 },
            "color": { "value": "#ffffff" },
            "shape": { "type": "circle" },
            "opacity": { "value": 0.2 },
            "size": { "value": 2 },
            "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.1, "width": 1 },
            "move": { "enable": true, "speed": 1 }
        },
        "interactivity": { "events": { "onhover": { "enable": true, "mode": "repulse" } } }
    });
</script>
</body>
</html>
