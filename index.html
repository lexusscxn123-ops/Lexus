<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HİDAYET - LEGACY</title>
    <style>
        :root { --g: #00ff41; --d: #000; }
        body { margin: 0; background: var(--d); color: var(--g); font-family: 'Courier New', monospace; overflow: hidden; }
        
        /* Arka Plan Matrix */
        canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.2; }

        /* Ana Panel */
        .container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; width: 100%;
        }

        /* Daktilo Efektli İsim */
        .typewriter h1 {
            font-size: 55px; letter-spacing: 15px; color: #fff;
            overflow: hidden; border-right: .15em solid var(--g);
            white-space: nowrap; margin: 0 auto;
            animation: typing 3.5s steps(30, end), blink-caret .5s step-end infinite;
        }

        /* Köşe İmzaları */
        .top-left { position: fixed; top: 20px; left: 20px; font-size: 10px; color: #333; letter-spacing: 3px; }
        .bottom-info { position: fixed; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box; font-size: 10px; color: #444; }

        @keyframes typing { from { width: 0 } to { width: 50% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: var(--g) } }

        #yt-player { position: absolute; top: -999px; }
    </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="top-left">LEXUS INTELLIGENCE // EST. 2018</div>

<div class="container">
    <div class="typewriter">
        <h1>/HİDAYET</h1>
    </div>
    <p style="letter-spacing: 5px; font-size: 12px; margin-top: 20px; opacity: 0.6;">I DON'T LIKE . REMIX</p>
</div>

<div class="bottom-info">
    <span>AUDIO ACTIVE: CHIEF KEEF</span>
    <span id="time">00:00:00</span>
    <span>STATUS: OPERATIONAL</span>
</div>

<iframe id="yt-player" width="0" height="0" 
src="https://www.youtube.com/embed/2WcRXJ4piHg?autoplay=1&loop=1&playlist=2WcRXJ4piHg" 
frameborder="0" allow="autoplay"></iframe>

<script>
    // Matrix Efekti
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const drops = Array(Math.floor(canvas.width/18)).fill(1);
    function draw() {
        ctx.fillStyle = "rgba(0,0,0,0.05)";
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#00ff41";
        drops.forEach((y, i) => {
            ctx.fillText("01/"[Math.floor(Math.random()*3)], i*18, y*18);
            if(y*18 > canvas.height && Math.random() > 0.99) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(draw, 50);

    // Saat
    setInterval(() => { document.getElementById('time').innerText = new Date().toLocaleTimeString(); }, 1000);

    // Müzik Başlatma (İlk Tıklamada)
    window.onclick = () => { 
        document.getElementById('yt-player').src += "&enablejsapi=1";
        const player = document.getElementById('yt-player');
        player.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    };
</script>
</body>
</html>
