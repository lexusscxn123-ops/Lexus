<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEXUS // JINX // ERC4C3N</title>
    <style>
        :root { --main: #ffffff; --sub: #0a0a0a; --gray: #222; }
        body { margin: 0; background: #000; color: var(--main); font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; user-select: none; }
        
        /* Arka Plan Modern Dokunuş */
        #particles-js { position: fixed; width: 100%; height: 100%; z-index: 1; }
        .vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; box-shadow: inset 0 0 350px #000; z-index: 2; pointer-events: none; }

        .container { z-index: 10; text-align: center; }

        /* Trinity İsimleri - Sert ve Büyük */
        .name-group { margin-bottom: 50px; }
        .name { 
            font-size: 75px; letter-spacing: 25px; font-weight: 900; display: block; 
            margin: 15px 0; color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,0.15);
            transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1); cursor: default;
            text-transform: uppercase;
        }
        .name:hover { 
            color: #fff; -webkit-text-stroke: 1px #fff; letter-spacing: 40px;
            text-shadow: 0 0 70px rgba(255,255,255,0.4);
        }

        /* Linkler - Sadece Discord ve TikTok (Spotify Kaldırıldı) */
        .links { display: flex; justify-content: center; gap: 30px; margin-top: 40px; }
        .links a { 
            color: #444; text-decoration: none; font-size: 11px; letter-spacing: 5px; 
            text-transform: uppercase; padding: 12px 30px; border: 1px solid #111; transition: 0.4s;
        }
        .links a:hover { border-color: #fff; color: #fff; background: rgba(255,255,255,0.03); }
        .discord-btn { border-color: #5865F2 !important; color: #5865F2 !important; }
        .discord-btn:hover { background: #5865F2 !important; color: #fff !important; }

        /* Alt Yazı (Prim Göndermesi) */
        .shoutout {
            position: fixed; bottom: 60px; width: 100%; text-align: center;
            font-size: 12px; letter-spacing: 4px; color: #1a1a1a; font-style: italic;
            transition: 1.5s;
        }
        body:hover .shoutout { color: #555; }

        /* Giriş Paneli */
        #gate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; }
        .gate-btn { color: #1a1a1a; font-size: 11px; letter-spacing: 12px; cursor: pointer; transition: 0.5s; border: 1px solid #0a0a0a; padding: 25px 50px; }
        .gate-btn:hover { color: #fff; border-color: #222; }

        #yt-player { position: absolute; top: -999px; visibility: hidden; }
    </style>
</head>
<body onclick="unlock()">

<div id="gate">
    <div class="gate-btn">BAĞLANTIYI KUR</div>
</div>

<div id="particles-js"></div>
<div class="vignette"></div>

<div class="container">
    <div class="name-group">
        <span class="name">LEXUS</span>
        <span class="name">JINX</span>
        <span class="name">erc4c3n</span>
    </div>

    <div class="links">
        <a href="https://discord.gg/9RYn8dNDh" class="discord-btn" target="_blank">Sunucu</a>
        <a href="https://discord.com/users/e.okul" target="_blank">Lexus Profile</a>
        <a href="https://www.tiktok.com/@lexuscxnnn" target="_blank">TikTok</a>
    </div>
</div>

<div class="shoutout">Adımızı etiketleyip prim kasmaya devam edin 😄</div>

<iframe id="yt-player" width="0" height="0" src="" frameborder="0" allow="autoplay"></iframe>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
    function unlock() {
        const gate = document.getElementById('gate');
        const player = document.getElementById('yt-player');
        
        if (gate.style.display !== 'none') {
            gate.style.opacity = '0';
            setTimeout(() => gate.style.display = 'none', 500);
            // Belirttiğin Yener Çevik - Güm Güm Linki
            player.src = "https://www.youtube.com/embed/xbr5sV68laE?autoplay=1&loop=1&playlist=xbr5sV68laE";
        }
    }

    particlesJS("particles-js", {
        "particles": {
            "number": { "value": 40, "density": { "enable": true, "value_area": 800 } },
            "color": { "value": "#ffffff" },
            "opacity": { "value": 0.05, "random": true },
            "size": { "value": 1, "random": true },
            "line_linked": { "enable": true, "distance": 200, "color": "#ffffff", "opacity": 0.03, "width": 1 },
            "move": { "enable": true, "speed": 0.4 }
        }
    });
</script>
</body>
</html>
