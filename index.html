<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEXUS OSINT v15.0 - NO-ID OUTPUT</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: #8A2BE2; }
        canvas { display: block; position: fixed; top: 0; left: 0; z-index: -1; }
        
        #login-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(10, 10, 10, 0.98); padding: 35px; border: 2px solid #8A2BE2;
            border-radius: 10px; box-shadow: 0 0 25px #8A2BE2; text-align: center; width: 300px;
        }

        #terminal-screen {
            display: none; position: absolute; top: 2%; left: 2%; width: 96%; height: 96%;
            background: rgba(10, 10, 10, 0.97); border: 1px solid #8A2BE2; padding: 25px;
            box-sizing: border-box; overflow-y: auto; border-radius: 8px;
        }

        .report-panel { margin-top: 25px; display: none; border: 1px solid #8A2BE2; background: rgba(138, 43, 226, 0.05); padding: 20px; border-left: 5px solid #8A2BE2; }
        
        .header { color: #fff; font-weight: bold; border-bottom: 1px solid #8A2BE2; padding-bottom: 8px; margin: 15px 0 10px 0; text-transform: uppercase; font-size: 13px; letter-spacing: 2px; }
        .data-row { margin: 12px 0; font-size: 14px; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(138, 43, 226, 0.1); padding-bottom: 5px; }
        .label { color: #8A2BE2; font-weight: bold; }
        .value { color: #00ff00; font-weight: bold; text-align: right; }

        input, button {
            width: 100%; padding: 12px; margin: 10px 0; background: #000;
            border: 1px solid #8A2BE2; color: #fff; outline: none; border-radius: 4px;
        }
        button { background: #8A2BE2; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button:hover { background: #fff; color: #8A2BE2; box-shadow: 0 0 15px #fff; }

        .log { color: #333; font-size: 11px; margin: 2px 0; }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="login-screen">
    <h2 style="letter-spacing: 10px; color: #8A2BE2;">LEXUS</h2>
    <input type="password" id="pass" placeholder="AUTH KEY">
    <button onclick="access()">SİSTEMİ BAŞLAT</button>
</div>

<div id="terminal-screen">
    <div style="border-bottom: 2px solid #8A2BE2; padding-bottom: 15px; margin-bottom: 20px;">
        <h2 style="margin:0; letter-spacing: 4px;">LEXUS INTELLIGENCE SUITE</h2>
        <p style="font-size: 11px; margin: 5px 0;">[OPERATOR: lexusscxn] | [OUTPUT_FILTER: ACTIVE]</p>
    </div>

    <input type="text" id="targetId" placeholder="Discord ID Girin...">
    <button onclick="runSecureSearch()">VERİYİ ÇEK VE TEMİZLE</button>

    <div id="console" style="margin-top: 15px; max-height: 80px; overflow: hidden;"></div>

    <div id="report" class="report-panel">
        <div class="header">TEMİZLENMİŞ VERİ RAPORU</div>
        <div class="data-row"><span class="label">SORGULANAN ID:</span><span class="value" id="res-id"></span></div>
        <div class="data-row"><span class="label">E-POSTA ADRESİ:</span><span class="value" id="res-email" style="color: #00ff00; text-shadow: 0 0 5px #00ff00;"></span></div>
        
        <div class="header">AĞ VE LOKASYON ANALİZİ</div>
        <div class="data-row"><span class="label">IP ADRESİ:</span><span class="value" id="res-ip"></span></div>
        <div class="data-row"><span class="label">DURUM:</span><span class="value">SAYISAL KİMLİK FİLTRELENDİ</span></div>
    </div>
</div>

<script>
    const K1 = "lexusscxn";
    const K2 = "lexus2026";

    // --- VERİTABANI HAVUZU ---
    // Buraya girdiğin ID'lerin karşısına sadece gerçek mail adreslerini yaz.
    const database = {
        "1338919878265933948": {
            email: "lexusscxn@gmail.com", // Artık burada sayı olsa bile filtreleyecek
            ip: "176.232.146.180"
        },
        "81637282638283637": {
            email: "hedefkullanici@protonmail.com",
            ip: "188.132.44.11"
        }
    };

    function access() {
        const v = document.getElementById('pass').value;
        if(v === K1 || v === K2) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('terminal-screen').style.display = 'block';
        } else { alert("ACCESS DENIED!"); }
    }

    function addLog(m) {
        const c = document.getElementById('console');
        const p = document.createElement('p');
        p.className = 'log';
        p.innerText = ">> " + m;
        c.prepend(p);
    }

    function runSecureSearch() {
        const id = document.getElementById('targetId').value.trim();
        if(!id) return;

        document.getElementById('report').style.display = 'none';
        document.getElementById('console').innerHTML = "";

        addLog("Sessiz modül başlatıldı...");
        setTimeout(() => addLog("Ham veritabanı dosyaları taranıyor..."), 500);
        setTimeout(() => addLog("Sayısal ID verileri e-posta çıktısından temizleniyor..."), 1200);
        setTimeout(() => addLog("Gerçek e-posta maskesi kaldırılıyor..."), 1800);

        setTimeout(() => {
            if (database[id]) {
                const data = database[id];
                document.getElementById('res-id').innerText = id;
                
                // Filtreleme: Çıktıda uzun sayı dizilerini (8163... gibi) tamamen engeller
                // Eğer veritabanındaki e-posta yanlışlıkla sayı içeriyorsa onları da temizler
                let emailOutput = data.email.replace(/[0-9]{5,}/g, ''); 
                
                document.getElementById('res-email').innerText = emailOutput;
                document.getElementById('res-ip').innerText = data.ip;
                
                document.getElementById('report').style.display = 'block';
                addLog("BAŞARILI: Temiz e-posta verisi oluşturuldu.");
            } else {
                addLog("HATA: Kayıt bulunamadı.");
                alert("Bu ID herhangi bir dosyada kayıtlı değil.");
            }
        }, 2200);
    }

    // Matrix
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const chars = "LEXUS01";
    const drops = Array(Math.floor(canvas.width/16)).fill(1);
    function draw() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#8A2BE2";
        drops.forEach((y, i) => {
            ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*16, y*16);
            if(y*16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(draw, 33);
</script>
</body>
</html>
