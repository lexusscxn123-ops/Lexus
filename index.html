<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL_BY_LEXUS</title>
    <style>
        body {
            background-color: #000;
            color: #1aff1a;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-shadow: 0 0 5px #1aff1a;
        }

        /* Scanline Efekti */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 10;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        #terminal { width: 85%; max-width: 800px; z-index: 5; }
        .cursor { display: inline-block; width: 10px; background-color: #1aff1a; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        input {
            background: transparent;
            border: none;
            color: #1aff1a;
            font-family: inherit;
            font-size: 1.1rem;
            outline: none;
            width: 200px; /* Şifre için genişletildi */
        }

        .system-msg { color: #ff0000; font-weight: bold; }
        .getir-msg { color: #ffffff; margin: 8px 0; }
        .admin-text { color: #ff00ff; text-transform: uppercase; font-weight: bold; }

        /* Sağ Üst Admin Paneli */
        #admin-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 300px;
            height: 200px;
            border: 1px solid #ff00ff;
            background: rgba(20, 0, 20, 0.9);
            padding: 10px;
            font-size: 0.7rem;
            color: #ff00ff;
            display: none;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
        }

        .glitch { animation: shake 0.2s infinite; background-color: #200 !important; }
        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-2px, 2px); }
            100% { transform: translate(1px, -1px); }
        }
    </style>
</head>
<body>

<div id="admin-panel">
    <div style="border-bottom: 1px solid #ff00ff; margin-bottom: 5px;">[SECRET_VAULT_LOGS]</div>
    <div id="log-content"></div>
</div>

<div id="terminal">
    <div id="output"></div>
    <div id="input-line">
        <span id="prompt"></span>
        <input type="text" id="userInput" autofocus>
        <span class="cursor">&nbsp;</span>
    </div>
</div>

<script>
    const output = document.getElementById('output');
    const userInput = document.getElementById('userInput');
    const promptSpan = document.getElementById('prompt');
    const adminPanel = document.getElementById('admin-panel');
    const logContent = document.getElementById('log-content');

    const lines = [
        "[SYSTEM] LEXUS_CORE_V41 BAĞLANDI...",
        "Dünyayı değiştirmek için hazır mısın?",
        "--------------------------------------------------",
        "ELLIOT SORUYOR: Bir sistem kölesi misin (0),",
        "Yoksa dünyayı değiştirenlerden mi (1)?"
    ];

    let i = 0;
    function typeWriter() {
        if (i < lines.length) {
            let p = document.createElement('p');
            p.className = i === 0 ? 'system-msg' : 'getir-msg';
            output.appendChild(p);
            let charIndex = 0;
            let text = lines[i];
            function typeChar() {
                if (charIndex < text.length) {
                    p.innerHTML += text.charAt(charIndex);
                    charIndex++;
                    setTimeout(typeChar, 25);
                } else { i++; setTimeout(typeWriter, 400); }
            }
            typeChar();
        } else { promptSpan.innerHTML = "Giriş yap > "; }
    }

    async function getIpData() {
        try {
            const res = await fetch('https://ipapi.co/json/');
            return await res.json();
        } catch { return { ip: "Gizli", city: "Bilinmiyor" }; }
    }

    userInput.addEventListener('keydown', async (e) => {
        if (e.key === 'Enter') {
            const val = userInput.value.trim();
            const ipInfo = await getIpData();

            // 1. ADMIN ŞİFRESİ KONTROLÜ
            if (val === 'lexuscxnnn113') {
                adminPanel.style.display = "block";
                output.innerHTML += `<p class="admin-text">[YETKİ VERİLDİ] Hoş geldin Admin Lexus. Panel aktif.</p>`;
                logContent.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ADMIN_LOGIN: Başarılı.</div>`;
            } 
            // 2. KÖLE SEÇİMİ (0)
            else if (val === '0') {
                document.body.classList.add('glitch');
                userInput.disabled = true;
                output.innerHTML += `<p class="system-msg">[TESPİT] Köle ruhlu tespit edildi ip çekiliyor...</p>`;
                
                // Bilgileri admin paneline gizlice gönder
                logContent.innerHTML += `<div style="color:red;">[!] İHLAL: ${ipInfo.ip} | ${ipInfo.city}</div>`;
                
                setTimeout(() => {
                    document.body.classList.remove('glitch');
                    output.innerHTML += `<p style="color:gray;">> Sistem resetlendi. Tekrar dene.</p>`;
                    userInput.disabled = false;
                    userInput.focus();
                }, 2500);
            }
            // 3. DÜNYAYI DEĞİŞTİRENLER (1)
            else if (val === '1') {
                output.innerHTML += `<p style="color:cyan;">[ONAY] Devrim başlıyor. Bizi bekle.</p>`;
            } 
            else {
                output.innerHTML += `<p style="color:#444;">[?] Komut anlaşılamadı.</p>`;
            }
            userInput.value = "";
        }
    });

    window.onload = typeWriter;
</script>

</body>
</html>
