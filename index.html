<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE TRINITY // VOID</title>
    <style>
        :root { --main: #ffffff; --sub: #111; --accent: #5865F2; }
        body { margin: 0; background: #000; color: var(--main); font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; user-select: none; }
        
        #particles-js { position: fixed; width: 100%; height: 100%; z-index: 1; }
        .vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; box-shadow: inset 0 0 350px #000; z-index: 2; pointer-events: none; }

        .container { z-index: 10; text-align: center; }

        .name-box { margin-bottom: 50px; }
        .name { 
            font-size: 75px; letter-spacing: 30px; font-weight: 900; display: block; 
            margin: 10px 0; color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,0.15);
            transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1); cursor: default;
            text-transform: uppercase;
        }
        .name:hover { 
            color: #fff; -webkit-text-stroke: 1px #fff; letter-spacing: 45px;
            text-shadow: 0 0 70px rgba(255,255,255,0.4);
        }

        .links { display: flex; justify-content: center; gap: 25px; margin-top: 40px; }
        .links a { 
            color: #666; text-decoration: none; font-size: 11px; letter-spacing: 4px; 
            text-transform: uppercase; padding: 12px 25px; border: 1px solid #111; transition: 0.4s;
        }
        .links a:hover { border-color: #fff; color: #fff; background: rgba(255,255,255,0.03); }
        .discord-link:hover { border-color: var(--accent) !important; color: var(--accent) !important; box-shadow: 0 0 20px rgba(88,101,242,0.2); }

        .shoutout {
            position: fixed; bottom: 50px; width: 100%; text-align: center;
            font-size: 12px; letter-spacing: 3px; color: #1a1a1a; font-style: italic;
            transition: 1s;
        }
        .container:hover ~ .shoutout { color: #fff; }

        /* Spotify Player Alanı */
        #spotify-container {
            position: fixed; bottom: -100px; left: 20px; z-index: 100;
            transition: 1s cubic-bezier(0.16, 1, 0.3, 1); opacity: 0;
        }
        #spotify-container.active { bottom: 20px; opacity: 1; }

        #gate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; }
        .gate-btn { color: #222; font-size: 11px; letter-spacing: 12px; cursor: pointer; transition: 0.5s; border: 1px solid #0a0a0a; padding: 25px 50px; }
        .gate-btn:hover { color: #fff; border-color: #333; letter-spacing: 15px; }
    </style>
</head>
<body onclick="unlock()">

<div id="gate">
    <div class="gate-btn">SİSTEME ERİŞİM</div>
</div>

<div id="particles-js"></div>
<div class="vignette"></div>

<div class="container">
    <div class="name-box">
        <span class="name">LEXUS</span>
        <span class="name">JINX</span>
        <span class="name">erc4c3n</span>
    </div>

    <div class="links">
        <a href="https://discord.gg/9RYn8dNDh" class="discord-link" target="_blank">Sunucu</a>
        <a href="https://discord.com/users/e.okul" target="_blank">Lexus</a>
        <a href="https://www.tiktok.com/@lexuscxnnn" target="_blank">TikTok</a>
    </div>
</div>

<div class="shoutout">Adımızı etiketleyip prim kasmaya devam edin 😄</div>

<div id="spotify-container">
    <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/25K4Zt0MvA7v4XzH8zQvRE?utm_source=generator&theme=0" width="300" height="80" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
</div>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
    function unlock() {
        const gate = document.getElementById('gate');
        const spotify = document.getElementById('spotify-container');
        
        if (gate.style.display !== 'none') {
            gate.style.opacity = '0';
            setTimeout(() => {
                gate.style.display = 'none';
                spotify.classList.add('active');
            }, 500);
        }
    }

    particlesJS("particles-js", {
        "particles": {
            "number": { "value": 40, "density": { "enable": true, "value_area": 800 } },
            "color": { "value": "#ffffff" },
            "opacity": { "value": 0.05, "random": true },
            "size": { "value": 1, "random": true },
            "line_linked": { "enable": true, "distance": 200, "color": "#ffffff", "opacity": 0.03, "width": 1 },
            "move": { "enable": true, "speed": 0.5, "direction": "none", "random": true, "straight": false, "out_mode": "out" }
        }
    });
</script>
</body>
</html>
