<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Discord ID Sorgulama | IndexedDB Büyük Dosya</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at 30% 20%, #0a0e1a 0%, #05070f 100%);
            font-family: 'Segoe UI', monospace;
            min-height: 100vh;
            color: #eef2ff;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: rgba(8, 12, 20, 0.98);
            backdrop-filter: blur(15px);
            transition: 0.3s;
            z-index: 1000;
            padding: 2rem 1.2rem;
            border-right: 2px solid #ff2a2a;
        }
        .sidebar.open { left: 0; }
        .sidebar .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.8rem;
            cursor: pointer;
            color: #ff2a2a;
        }
        .sidebar .menu-item {
            padding: 0.8rem 1rem;
            margin: 0.3rem 0;
            background: rgba(255, 42, 42, 0.1);
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
        }
        .sidebar .menu-item:hover {
            background: #ff2a2a;
            color: #000;
            transform: translateX(5px);
        }
        .menu-toggle {
            position: fixed;
            top: 1rem;
            left: 1rem;
            font-size: 1.8rem;
            cursor: pointer;
            color: #ff2a2a;
            z-index: 999;
            background: rgba(0, 0, 0, 0.5);
            padding: 0.4rem 0.9rem;
            border-radius: 12px;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 998;
            display: none;
        }
        .overlay.active { display: block; }
        .main-content {
            padding: 5rem 1.5rem 2rem 1.5rem;
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: rgba(20, 25, 40, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid rgba(255, 42, 42, 0.3);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, rgba(255, 42, 42, 0.15), rgba(255, 42, 42, 0.05));
            padding: 1.2rem 1.8rem;
            border-bottom: 1px solid rgba(255, 42, 42, 0.2);
            text-align: center;
        }
        .card-header h2 { color: #ff2a2a; font-size: 1.4rem; }
        .card-body { padding: 1.8rem; }

        input {
            width: 100%;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 42, 42, 0.5);
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            outline: none;
            text-align: center;
        }
        input:focus {
            border-color: #ff2a2a;
            box-shadow: 0 0 10px rgba(255, 42, 42, 0.3);
        }
        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(95deg, #ff2a2a, #cc0000);
            border: none;
            border-radius: 14px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 1rem;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 42, 42, 0.4);
        }
        .alert {
            padding: 0.8rem;
            border-radius: 12px;
            margin: 1rem 0;
            text-align: center;
        }
        .alert-error { background: rgba(255, 0, 0, 0.2); border-left: 4px solid #ff4444; color: #ff8888; }
        .alert-success { background: rgba(0, 255, 0, 0.2); border-left: 4px solid #00ff88; color: #88ff88; }
        .alert-info { background: rgba(255, 42, 42, 0.15); border-left: 4px solid #ff2a2a; color: #ff9999; }
        .alert-warning { background: rgba(255, 165, 0, 0.2); border-left: 4px solid #ffa500; color: #ffcc66; }
        
        .result-box {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            padding: 1rem;
            margin-top: 1rem;
            border-left: 3px solid #ff2a2a;
            font-family: monospace;
            font-size: 0.8rem;
            word-break: break-all;
            max-height: 400px;
            overflow-y: auto;
        }
        .admin-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 9999;
            font-size: 1.2rem;
            color: #ff2a2a;
            border: 1px solid #ff2a2a;
            opacity: 0.5;
        }
        .admin-button:hover { opacity: 1; background: #ff2a2a; color: white; }
        
        .log-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 0.5rem;
            margin: 0.3rem 0;
            border-radius: 8px;
            font-size: 0.7rem;
        }
        hr { border-color: rgba(255, 42, 42, 0.2); margin: 1rem 0; }
        .progress-bar {
            width: 100%;
            height: 25px;
            background: #333;
            border-radius: 12px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff2a2a, #ff6666);
            width: 0%;
            transition: width 0.3s;
            border-radius: 12px;
        }
        
        @media (max-width: 650px) {
            .main-content { padding: 5rem 0.8rem 1rem 0.8rem; }
            .result-box { font-size: 0.7rem; }
        }
    </style>
</head>
<body>

<div class="admin-button" onclick="showAdminLogin()">👑</div>
<div class="menu-toggle" onclick="toggleSidebar()">☰</div>
<div class="sidebar">
    <div class="close-btn" onclick="toggleSidebar()">✕</div>
    <div style="text-align: center; margin-bottom: 2rem;">
        <div style="font-size: 2.5rem;">🕵️</div>
        <div style="color: #ff2a2a; font-weight: bold;">OSINT PANEL</div>
    </div>
    <div class="menu-item" onclick="showMain()">🔍 ID SORGULA</div>
    <div class="menu-item" onclick="showStats()">📊 İSTATİSTİK</div>
</div>
<div class="overlay" onclick="toggleSidebar()"></div>

<div class="main-content">
    <div class="card">
        <div class="card-header">
            <h2>🔍 DISCORD ID SORGULAMA</h2>
        </div>
        <div class="card-body" id="pageContent">
            <input type="text" id="searchId" placeholder="Discord ID Girin">
            <button onclick="searchId()">🔎 SORGULA</button>
            <div id="resultArea"></div>
            <div id="infoArea" class="alert-info" style="margin-top:1rem; padding:0.5rem; text-align:center; font-size:0.7rem;">💾 Veritabanı: <span id="dbStatus">Kontrol ediliyor...</span></div>
        </div>
    </div>
</div>

<script>
    // ========== INDEXEDDB İLE BÜYÜK DOSYA DESTEĞİ ==========
    let db = null;
    let DB_NAME = "DiscordDB";
    let STORE_NAME = "data";
    let isDbReady = false;
    let totalLines = 0;
    let logs = JSON.parse(localStorage.getItem('osint_logs_secret') || '[]');
    let isAdminMode = false;
    const ADMIN_PASSWORD = "Lexus2024";
    
    // IndexedDB Başlat
    function initDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 1);
            
            request.onerror = function() {
                console.error("DB hatası");
                reject();
            };
            
            request.onsuccess = function() {
                db = request.result;
                isDbReady = true;
                checkDatabaseStatus();
                resolve();
            };
            
            request.onupgradeneeded = function(e) {
                db = e.target.result;
                if(!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME);
                }
            };
        });
    }
    
    // Veritabanı durumunu kontrol et
    async function checkDatabaseStatus() {
        if(!db) await initDB();
        
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const countRequest = store.count();
        
        countRequest.onsuccess = function() {
            if(countRequest.result > 0) {
                // Veri var, satır sayısını al
                const getRequest = store.get('meta');
                getRequest.onsuccess = function() {
                    if(getRequest.result) {
                        totalLines = getRequest.result.totalLines || 0;
                        document.getElementById('dbStatus').innerHTML = `✅ Yüklü (${totalLines.toLocaleString()} satır)`;
                    } else {
                        document.getElementById('dbStatus').innerHTML = `✅ Veri var (${countRequest.result} parça)`;
                    }
                };
            } else {
                document.getElementById('dbStatus').innerHTML = `⚠️ Veritabanı boş - Admin yüklemeli`;
            }
        };
    }
    
    // ID Sorgulama (IndexedDB'de arama)
    async function searchId() {
        const id = document.getElementById('searchId').value.trim();
        const resultDiv = document.getElementById('resultArea');
        
        if(!id) {
            resultDiv.innerHTML = '<div class="alert alert-error">❌ ID girin!</div>';
            return;
        }
        
        if(!db) await initDB();
        
        // Veri var mı kontrol et
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const countRequest = store.count();
        
        countRequest.onsuccess = function() {
            if(countRequest.result === 0) {
                resultDiv.innerHTML = '<div class="alert alert-error">⚠️ Veritabanı boş! Admin dosyayı yüklemeli.</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div class="alert alert-info">🔍 Aranıyor...</div>';
            addLog('ID SORGULANDI', `ID: ${id}`);
            
            // Tüm verileri tara (büyük dosya için async)
            const getAllRequest = store.getAll();
            let found = false;
            let foundLines = [];
            
            getAllRequest.onsuccess = function() {
                const items = getAllRequest.result;
                for(let item of items) {
                    if(item.key !== 'meta' && item.value && item.value.includes(id)) {
                        found = true;
                        // Sadece ilgili satırları al
                        const lines = item.value.split('\n');
                        for(let line of lines) {
                            if(line.includes(id)) {
                                foundLines.push(line.substring(0, 300));
                            }
                        }
                    }
                }
                
                if(found) {
                    let html = `<div class="result-box"><h3 style="color:#ff2a2a;">✅ SONUÇ BULUNDU!</h3>`;
                    foundLines.forEach(line => {
                        let safeLine = line.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        html += `<p><code>${safeLine}</code></p><hr>`;
                    });
                    html += `<p style="font-size:0.7rem;">🔍 ${foundLines.length} satırda bulundu</p></div>`;
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = '<div class="alert alert-error">❌ Bu ID veritabanında bulunamadı.</div>';
                }
            };
        };
    }
    
    // Büyük dosyayı IndexedDB'ye yükle (1.37GB destekler)
    async function uploadToIndexedDB(file) {
        const statusDiv = document.getElementById('uploadStatus');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        
        progressBar.style.display = 'block';
        statusDiv.innerHTML = '<div class="alert alert-info">📥 Dosya okunuyor...</div>';
        
        const CHUNK_SIZE = 50 * 1024 * 1024; // 50MB parçalar
        let offset = 0;
        let chunkIndex = 0;
        
        // Önce eski verileri temizle
        const clearTransaction = db.transaction([STORE_NAME], 'readwrite');
        const clearStore = clearTransaction.objectStore(STORE_NAME);
        clearStore.clear();
        
        let totalChunks = Math.ceil(file.size / CHUNK_SIZE);
        let loadedChunks = 0;
        
        function readNextChunk() {
            if(offset >= file.size) {
                // Meta veriyi kaydet
                const metaTransaction = db.transaction([STORE_NAME], 'readwrite');
                const metaStore = metaTransaction.objectStore(STORE_NAME);
                metaStore.put({ totalLines: totalLines, totalSize: file.size, chunks: chunkIndex }, 'meta');
                
                statusDiv.innerHTML = `<div class="alert alert-success">✅ Yükleme tamamlandı! ${totalLines.toLocaleString()} satır, ${(file.size/1024/1024).toFixed(2)} MB</div>`;
                progressBar.style.display = 'none';
                addLog('ADMIN', `Veritabanı yüklendi: ${totalLines} satır, ${(file.size/1024/1024).toFixed(2)} MB`);
                document.getElementById('dbStatus').innerHTML = `✅ Yüklü (${totalLines.toLocaleString()} satır)`;
                setTimeout(() => { statusDiv.innerHTML = ''; }, 3000);
                return;
            }
            
            const end = Math.min(offset + CHUNK_SIZE, file.size);
            const blob = file.slice(offset, end);
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const text = e.target.result;
                
                // Satır sayısını hesapla
                const linesInChunk = text.split('\n').length;
                totalLines += linesInChunk;
                
                // IndexedDB'ye kaydet
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                store.put(text, `chunk_${chunkIndex}`);
                
                chunkIndex++;
                loadedChunks++;
                const percent = (loadedChunks / totalChunks) * 100;
                progressFill.style.width = percent + '%';
                statusDiv.innerHTML = `<div class="alert alert-info">📥 Yükleniyor: ${loadedChunks}/${totalChunks} parça (${Math.round(percent)}%)</div>`;
                
                offset = end;
                readNextChunk();
            };
            
            reader.onerror = function() {
                statusDiv.innerHTML = '<div class="alert alert-error">❌ Okuma hatası!</div>';
                progressBar.style.display = 'none';
            };
            
            reader.readAsText(blob, "UTF-8");
        }
        
        readNextChunk();
    }
    
    // Admin Panel
    function showAdminLogin() {
        let pwd = prompt("🔐 Yönetici Şifresi:");
        if(pwd === ADMIN_PASSWORD) {
            isAdminMode = true;
            addLog('ADMIN', 'Admin paneli açıldı');
            showAdminPanel();
        } else if(pwd) {
            alert("❌ Geçersiz şifre!");
        }
    }
    
    async function showAdminPanel() {
        if(!isAdminMode) return;
        
        if(!db) await initDB();
        
        // Veritabanı boyutunu hesapla
        let dbSize = 0;
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const getAllRequest = store.getAll();
        
        getAllRequest.onsuccess = function() {
            const items = getAllRequest.result;
            for(let item of items) {
                if(item.key !== 'meta' && item.value) {
                    dbSize += item.value.length;
                }
            }
            const sizeMB = (dbSize / 1024 / 1024).toFixed(2);
            
            const content = document.getElementById('pageContent');
            content.innerHTML = `
                <h3 style="color:#ff2a2a;">👑 GİZLİ YÖNETİCİ PANELİ</h3>
                <hr>
                <div style="background:rgba(255,42,42,0.1); padding:1rem; border-radius:16px; margin-bottom:1rem;">
                    <h4>📁 VERİTABANI YÜKLE (MAX 2GB)</h4>
                    <input type="file" id="fileInput" accept=".txt">
                    <div class="progress-bar" id="progressBar" style="display:none;"><div class="progress-fill" id="progressFill"></div></div>
                    <div id="uploadStatus"></div>
                    <button onclick="uploadFile()" style="margin-top:0.5rem;">📤 YÜKLE</button>
                    <p style="font-size:0.7rem; margin-top:0.5rem;">⚠️ 1.37GB dosya desteklenir (IndexedDB)</p>
                </div>
                
                <div style="background:rgba(255,42,42,0.1); padding:1rem; border-radius:16px; margin-bottom:1rem;">
                    <h4>📊 VERİTABANI DURUMU</h4>
                    <p>📄 Toplam satır: <span id="adminRowCount">${totalLines.toLocaleString()}</span></p>
                    <p>💾 Boyut: <span id="adminSize">${sizeMB}</span> MB</p>
                    <button onclick="clearDatabase()" style="background:#ff4444;">🗑️ VERİTABANINI TEMİZLE</button>
                </div>
                
                <div style="background:rgba(255,42,42,0.1); padding:1rem; border-radius:16px; margin-bottom:1rem;">
                    <h4>📜 TÜM LOGLAR (${logs.length} kayıt)</h4>
                    <div style="max-height:300px; overflow-y:auto;">
                        ${logs.map(l => `<div class="log-item">[${l.time}] ${l.action} - ${l.detail}<br><small>📍 ${l.location || '?'} | ${l.device || '?'}</small></div>`).join('')}
                        ${logs.length === 0 ? '<p>Henüz log yok</p>' : ''}
                    </div>
                    <button onclick="clearLogs()" style="background:#ff4444; margin-top:0.5rem;">🗑️ LOGLARI TEMİZLE</button>
                </div>
                
                <button onclick="closeAdminPanel()" style="background:#333;">🔒 KAPAT</button>
            `;
        };
    }
    
    window.uploadFile = async function() {
        const fileInput = document.getElementById('fileInput');
        if(!fileInput.files.length) {
            document.getElementById('uploadStatus').innerHTML = '<div class="alert alert-error">Dosya seç!</div>';
            return;
        }
        
        const file = fileInput.files[0];
        const fileSizeMB = (file.size / 1024 / 1024).toFixed(2);
        
        if(file.size > 2 * 1024 * 1024 * 1024) {
            document.getElementById('uploadStatus').innerHTML = `<div class="alert alert-error">❌ Dosya çok büyük! Max 2GB (Bu dosya ${fileSizeMB} MB)</div>`;
            return;
        }
        
        document.getElementById('uploadStatus').innerHTML = `<div class="alert alert-info">📥 Yükleniyor: ${fileSizeMB} MB... Lütfen bekleyin!</div>`;
        totalLines = 0;
        await uploadToIndexedDB(file);
    };
    
    async function clearDatabase() {
        if(confirm('⚠️ VERİTABANINI SİLMEK İSTEDİĞİNE EMİN MİSİN?')) {
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            store.clear();
            totalLines = 0;
            addLog('ADMIN', 'Veritabanı silindi');
            alert('✅ Veritabanı temizlendi!');
            showAdminPanel();
            document.getElementById('dbStatus').innerHTML = '⚠️ Veritabanı boş - Admin yüklemeli';
        }
    }
    
    async function addLog(action, detail) {
        let ip = "Bilinmiyor";
        let loc = "Bilinmiyor";
        try {
            const res = await fetch('https://ipapi.co/json/');
            const data = await res.json();
            ip = data.ip || "Bilinmiyor";
            loc = (data.country_name || '?') + "/" + (data.city || '?');
        } catch(e) {}
        
        let device = /Mobile|Android|iPhone/i.test(navigator.userAgent) ? "📱 Mobil" : "💻 PC";
        
        logs.unshift({
            id: Date.now(),
            action: action,
            detail: detail,
            ip: ip,
            location: loc,
            device: device,
            time: new Date().toLocaleString('tr-TR')
        });
        if(logs.length > 200) logs.pop();
        localStorage.setItem('osint_logs_secret', JSON.stringify(logs));
    }
    
    function clearLogs() {
        if(confirm('Tüm logları sil?')) {
            logs = [];
            localStorage.setItem('osint_logs_secret', JSON.stringify(logs));
            addLog('ADMIN', 'Loglar temizlendi');
            showAdminPanel();
        }
    }
    
    function closeAdminPanel() {
        isAdminMode = false;
        showMain();
    }
    
    function showMain() {
        document.getElementById('pageContent').innerHTML = `
            <input type="text" id="searchId" placeholder="Discord ID Girin">
            <button onclick="searchId()">🔎 SORGULA</button>
            <div id="resultArea"></div>
            <div id="infoArea" class="alert-info" style="margin-top:1rem; padding:0.5rem; text-align:center; font-size:0.7rem;">💾 Veritabanı: <span id="dbStatus">Kontrol ediliyor...</span></div>
        `;
        checkDatabaseStatus();
        toggleSidebar();
    }
    
    function showStats() {
        document.getElementById('pageContent').innerHTML = `
            <h3 style="color:#ff2a2a;">📊 İSTATİSTİKLER</h3>
            <hr>
            <div class="result-box">
                <p>📄 Veritabanı Satır: ${totalLines.toLocaleString()}</p>
                <p>📜 Toplam Sorgu Logu: ${logs.length}</p>
            </div>
            <button onclick="showMain()" style="margin-top:1rem;">⬅️ GERİ</button>
        `;
        toggleSidebar();
    }
    
    function toggleSidebar() {
        document.querySelector('.sidebar').classList.toggle('open');
        document.querySelector('.overlay').classList.toggle('active');
    }
    
    // Başlangıç
    initDB().then(() => {
        checkDatabaseStatus();
    });
    
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if(e.ctrlKey && (e.key === 'u' || e.key === 'U')) e.preventDefault();
        if(e.key === 'F12') e.preventDefault();
    });
</script>
</body>
</html>
