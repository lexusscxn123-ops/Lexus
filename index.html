<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEXUS OSINT v6.0 - STABLE TERMINAL</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: #8A2BE2; }
        canvas { display: block; position: fixed; top: 0; left: 0; z-index: -1; }
        
        #login-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(10, 10, 10, 0.98); padding: 35px; border: 2px solid #8A2BE2;
            border-radius: 10px; box-shadow: 0 0 20px #8A2BE2; text-align: center; width: 300px;
        }

        #terminal-screen {
            display: none; position: absolute; top: 2%; left: 2%; width: 96%; height: 96%;
            background: rgba(10, 10, 10, 0.95); border: 1px solid #8A2BE2; padding: 20px;
            box-sizing: border-box; overflow-y: auto; border-radius: 5px;
        }

        .output-box { border: 1px dashed rgba(138, 43, 226, 0.5); padding: 15px; margin-top: 20px; display: none; }
        .data-line { margin: 10px 0; font-size: 14px; }
        .label { color: #fff; font-weight: bold; }
        .value { color: #00ff00; margin-left: 10px; word-break: break-all; }

        input, button {
            width: 100%; padding: 12px; margin: 10px 0; background: #000;
            border: 1px solid #8A2BE2; color: #fff; outline: none; border-radius: 4px;
        }
        button { background: #8A2BE2; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button:hover { background: #fff; color: #8A2BE2; }

        .log { color: #8A2BE2; font-size: 12px; margin: 5px 0; opacity: 0.8; }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="login-screen">
    <h2 style="letter-spacing: 5px;">LEXUS LOGIN</h2>
    <input type="password" id="key" placeholder="ACCESS KEY">
    <button onclick="checkKey()">SİSTEME GİRİŞ YAP</button>
</div>

<div id="terminal-screen">
    <div style="border-bottom: 2px solid #8A2BE2; padding-bottom: 10px; margin-bottom: 20px;">
        <h2 style="margin:0;">LEXUS OSINT SUITE v6.0</h2>
        <p style="font-size: 11px; margin: 5px 0;">OPERATOR: lexusscxn | STATUS: ACTIVE</p>
    </div>

    <input type="text" id="target" placeholder="ID, IP veya E-Posta Verisi Girin...">
    <button onclick="startSearch()">SORGULAMAYI BAŞLAT</button>

    <div id="logs" style="margin-top: 15px;"></div>

    <div id="results" class="output-box">
        <h3 style="color: #fff; border-bottom: 1px solid #8A2BE2; padding-bottom: 5px;">SORGULAMA SONUÇLARI</h3>
        <div class="data-line"><span class="label">E-POSTA:</span><span class="value" id="res-email"></span></div>
        <div class="data-line"><span class="label">IP ADRESİ:</span><span class="value" id="res-ip"></span></div>
        <div class="data-line"><span class="label">UYGULAMALAR:</span><span class="value" id="res-apps"></span></div>
        <div class="data-line"><span class="label">SUNUCU ID'LERİ:</span><span class="value" id="res-servers"></span></div>
        <div class="data-line"><span class="label">BİYOGRAFİ:</span><span class="value" id="res-bio"></span></div>
    </div>
</div>

<script>
    const KEY = "lexus2026";
    const ADMIN = "lexusscxn";

    function checkKey() {
        const val = document.getElementById('key').value;
        if(val === KEY || val === ADMIN) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('terminal-screen').style.display = 'block';
        } else {
            alert("HATALI ANAHTAR!");
        }
    }

    function addLog(text) {
        const logs = document.getElementById('logs');
        const div = document.createElement('div');
        div.className = 'log';
        div.innerText = ">> " + text;
        logs.prepend(div);
    }

    function startSearch() {
        const query = document.getElementById('target').value;
        if(!query) return;

        document.getElementById('results').style.display = 'none';
        document.getElementById('logs').innerHTML = "";

        addLog("Sessiz tarama modülü başlatıldı...");
        setTimeout(() => addLog("Veritabanı dosyaları taranıyor (Gizli Mod)..."), 700);
        setTimeout(() => addLog("Kayıtlar bulundu, veriler senkronize ediliyor..."), 1500);

        setTimeout(() => {
            // E-postayı olduğu gibi alıyoruz (hiçbir decode işlemi yok, ne girildiyse o)
            document.getElementById('res-email').innerText = query;
            document.getElementById('res-ip').innerText = "176.232." + Math.floor(Math.random()*255) + "." + Math.floor(Math.random()*255);
            document.getElementById('res-apps').innerText = "Discord, Instagram, Spotify, Riot Games, Roblox";
            document.getElementById('res-servers').innerText = "11294827... , 88492011... , 99203155...";
            document.getElementById('res-bio').innerText = "Lexus Database üzerinde kayıtlı aktif sanalcı profili.";
            
            document.getElementById('results').style.display = 'block';
            addLog("TARAMA TAMAMLANDI.");
        }, 2200);
    }

    // Matrix
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const chars = "LEXUS01";
    const drops = Array(Math.floor(canvas.width/16)).fill(1);
    function draw() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#8A2BE2";
        drops.forEach((y, i) => {
            ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*16, y*16);
            if(y*16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(draw, 33);
</script>
</body>
</html>
