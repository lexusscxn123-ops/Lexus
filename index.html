<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEXUS OSINT TERMINAL v3.0</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: #8A2BE2; }
        canvas { display: block; position: fixed; top: 0; left: 0; z-index: -1; }
        
        #login-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(10, 10, 10, 0.95); padding: 30px; border: 2px solid #8A2BE2;
            border-radius: 10px; box-shadow: 0 0 20px #8A2BE2; text-align: center; width: 320px;
        }

        #terminal-screen {
            display: none; position: absolute; top: 2%; left: 2%; width: 96%; height: 96%;
            background: rgba(10, 10, 10, 0.94); border: 1px solid #8A2BE2; padding: 20px;
            box-sizing: border-box; overflow-y: auto; border-radius: 5px;
        }

        .output-line { margin-bottom: 5px; font-size: 14px; white-space: pre-wrap; }
        .success { color: #00ff00; }
        .danger { color: #ff3333; }
        .info { color: #58a6ff; }
        .system { color: #8A2BE2; font-weight: bold; }

        input, button {
            width: 100%; padding: 12px; margin: 10px 0; background: #000;
            border: 1px solid #8A2BE2; color: #fff; outline: none; border-radius: 4px;
        }
        button { background: #8A2BE2; font-weight: bold; cursor: pointer; }
        button:hover { background: #fff; color: #8A2BE2; }

        .terminal-header { border-bottom: 1px solid #8A2BE2; padding-bottom: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="login-screen">
    <h2 style="letter-spacing: 5px;">LEXUS LOGIN</h2>
    <input type="password" id="key" placeholder="ACCESS KEY">
    <button onclick="checkKey()">SİSTEME GİRİŞ YAP</button>
</div>

<div id="terminal-screen">
    <div class="terminal-header">
        <h2 style="margin:0;">[LEXUS OSINT SUITE v3.0] - ADMIN: lexusscxn</h2>
        <p style="font-size: 12px; margin: 5px 0;">DATABASE CONNECTED | STATUS: ENCRYPTED</p>
    </div>

    <div id="input-area">
        <input type="text" id="target" placeholder="ID, Email veya IP Adresi girin...">
        <button onclick="startOsint()">OSINT TARAMASINI BAŞLAT</button>
    </div>

    <div id="output" style="margin-top: 20px;">
        <div class="output-line system">>> Lexus Terminal Hazır. Bekleniyor...</div>
    </div>
</div>

<script>
    const KEY = "lexus2026";
    const ADMIN = "lexusscxn";

    function checkKey() {
        const val = document.getElementById('key').value;
        if(val === KEY || val === ADMIN) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('terminal-screen').style.display = 'block';
            printLine(">> Erişim Onaylandı. Yetki: " + (val === ADMIN ? "ADMIN" : "USER"), "success");
        } else {
            alert("GEÇERSİZ ANAHTAR!");
        }
    }

    function printLine(text, type = "") {
        const container = document.getElementById('output');
        const div = document.createElement('div');
        div.className = "output-line " + type;
        div.innerText = text;
        container.prepend(div);
    }

    function startOsint() {
        const target = document.getElementById('target').value;
        if(!target) return;

        printLine("-------------------------------------------");
        printLine(">> " + target + " için derin tarama başlatıldı...", "info");

        // Simüle edilmiş OSINT adımları (Senin linkteki mantık)
        setTimeout(() => printLine(">> Veritabanları taranıyor: data.sql, discord_data.sql, id.txt...", "system"), 500);
        setTimeout(() => printLine(">> E-posta Kayıtları Sorgulanıyor: Instagram, Facebook, LinkedIn...", "info"), 1200);
        setTimeout(() => printLine(">> IP Lokasyon ve Servis Sağlayıcı Analiz Ediliyor...", "info"), 2000);
        
        setTimeout(() => {
            printLine(">> [!] SONUÇLAR BULUNDU", "success");
            printLine(">> Kayıtlı Platformlar: Instagram (Tespit Edildi), Discord (Bağlı)", "success");
            printLine(">> Sızıntı Durumu: " + (Math.random() > 0.5 ? "VERİ SIZINTISI BULUNDU (Breach Detected)" : "Temiz"), "danger");
            printLine(">> Lokasyon Verisi: [TR/Istanbul] - ISP: TurkTelecom", "info");
            printLine(">> Lexus ID Sorgu: " + Math.floor(Math.random()*99999999) + " [VERİ_DOĞRULANDI]", "success");
            printLine("-------------------------------------------");
        }, 3000);
    }

    // Matrix Background
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const chars = "LEXUS01";
    const drops = Array(Math.floor(canvas.width/16)).fill(1);
    function draw() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#8A2BE2";
        drops.forEach((y, i) => {
            ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*16, y*16);
            if(y*16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(draw, 33);
</script>
</body>
</html>
