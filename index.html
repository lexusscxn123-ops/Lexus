<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Discord ID Sorgulama | Hızlı & Hafif</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at 30% 20%, #0a0e1a 0%, #05070f 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            color: #eef2ff;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: rgba(8, 12, 20, 0.98);
            backdrop-filter: blur(15px);
            transition: 0.3s;
            z-index: 1000;
            padding: 2rem 1.2rem;
            border-right: 2px solid #ff2a2a;
        }
        .sidebar.open { left: 0; }
        .sidebar .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.8rem;
            cursor: pointer;
            color: #ff2a2a;
        }
        .sidebar .menu-item {
            padding: 0.8rem 1rem;
            margin: 0.3rem 0;
            background: rgba(255, 42, 42, 0.1);
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
        }
        .sidebar .menu-item:hover {
            background: #ff2a2a;
            color: #000;
            transform: translateX(5px);
        }
        .menu-toggle {
            position: fixed;
            top: 1rem;
            left: 1rem;
            font-size: 1.8rem;
            cursor: pointer;
            color: #ff2a2a;
            z-index: 999;
            background: rgba(0, 0, 0, 0.5);
            padding: 0.4rem 0.9rem;
            border-radius: 12px;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 998;
            display: none;
        }
        .overlay.active { display: block; }
        .main-content {
            padding: 5rem 1.5rem 2rem 1.5rem;
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: rgba(20, 25, 40, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid rgba(255, 42, 42, 0.3);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, rgba(255, 42, 42, 0.15), rgba(255, 42, 42, 0.05));
            padding: 1.2rem 1.8rem;
            border-bottom: 1px solid rgba(255, 42, 42, 0.2);
            text-align: center;
        }
        .card-header h2 { color: #ff2a2a; font-size: 1.4rem; }
        .card-body { padding: 1.8rem; }

        input {
            width: 100%;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 42, 42, 0.5);
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            outline: none;
            text-align: center;
        }
        input:focus {
            border-color: #ff2a2a;
            box-shadow: 0 0 10px rgba(255, 42, 42, 0.3);
        }
        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(95deg, #ff2a2a, #cc0000);
            border: none;
            border-radius: 14px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 1rem;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 42, 42, 0.4);
        }
        .alert {
            padding: 0.8rem;
            border-radius: 12px;
            margin: 1rem 0;
            text-align: center;
        }
        .alert-error { background: rgba(255, 0, 0, 0.2); border-left: 4px solid #ff4444; color: #ff8888; }
        .alert-success { background: rgba(0, 255, 0, 0.2); border-left: 4px solid #00ff88; color: #88ff88; }
        .alert-info { background: rgba(255, 42, 42, 0.15); border-left: 4px solid #ff2a2a; color: #ff9999; }
        
        .result-box {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            padding: 1rem;
            margin-top: 1rem;
            border-left: 3px solid #ff2a2a;
            font-family: monospace;
            font-size: 0.75rem;
            word-break: break-all;
            max-height: 350px;
            overflow-y: auto;
        }
        .admin-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 9999;
            font-size: 1.4rem;
            color: #ff2a2a;
            border: 2px solid #ff2a2a;
            transition: 0.2s;
        }
        .admin-button:hover { opacity: 1; background: #ff2a2a; color: white; transform: scale(1.05); }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff2a2a, #ff6666);
            width: 0%;
            transition: width 0.3s;
        }
        
        @media (max-width: 650px) {
            .main-content { padding: 5rem 0.8rem 1rem 0.8rem; }
            .result-box { font-size: 0.65rem; }
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ff2a2a;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- GİZLİ ADMIN BUTONU - SAĞ ALT KÖŞE -->
<div class="admin-button" onclick="showAdminLogin()">👑</div>

<div class="menu-toggle" onclick="toggleSidebar()">☰</div>
<div class="sidebar">
    <div class="close-btn" onclick="toggleSidebar()">✕</div>
    <div style="text-align: center; margin-bottom: 2rem;">
        <div style="font-size: 2.5rem;">🕵️</div>
        <div style="color: #ff2a2a; font-weight: bold;">OSINT PANEL</div>
    </div>
    <div class="menu-item" onclick="showMain()">🔍 ID SORGULA</div>
    <div class="menu-item" onclick="showStats()">📊 İSTATİSTİK</div>
</div>
<div class="overlay" onclick="toggleSidebar()"></div>

<div class="main-content">
    <div class="card">
        <div class="card-header">
            <h2>🔍 DISCORD ID SORGULAMA</h2>
        </div>
        <div class="card-body" id="pageContent">
            <input type="text" id="searchId" placeholder="Discord ID Girin (Örn: 123456789012345678)">
            <button onclick="searchId()">🔎 SORGULA</button>
            <div id="resultArea"></div>
            <div id="infoArea" class="alert-info" style="margin-top:1rem; padding:0.5rem; text-align:center; font-size:0.7rem;">
                💾 Veritabanı: <span id="dbStatus">Kontrol ediliyor...</span>
            </div>
        </div>
    </div>
</div>

<script>
    // ========== INDEXEDDB BÜYÜK DOSYA ==========
    let db = null;
    let dbReady = false;
    let idIndex = new Map(); // ID indexi (hızlı arama için!)
    let isAdminMode = false;
    const ADMIN_PASSWORD = "Lexus2024";
    
    // IndexedDB Başlat
    function initDB() {
        return new Promise((resolve) => {
            const request = indexedDB.open("DiscordIDDB", 2);
            request.onerror = () => { console.log("DB hatası"); resolve(false); };
            request.onsuccess = (e) => {
                db = e.target.result;
                dbReady = true;
                loadIdIndex();
                resolve(true);
            };
            request.onupgradeneeded = (e) => {
                db = e.target.result;
                if(!db.objectStoreNames.contains("data")) {
                    db.createObjectStore("data");
                }
            };
        });
    }
    
    // ID indexini yükle
    function loadIdIndex() {
        if(!db) return;
        const transaction = db.transaction(["data"], "readonly");
        const store = transaction.objectStore("data");
        const getRequest = store.get("idIndex");
        getRequest.onsuccess = () => {
            if(getRequest.result) {
                idIndex = new Map(JSON.parse(getRequest.result));
                document.getElementById('dbStatus') && (document.getElementById('dbStatus').innerHTML = `✅ ${idIndex.size.toLocaleString()} ID indeksli`);
            } else {
                document.getElementById('dbStatus') && (document.getElementById('dbStatus').innerHTML = `⚠️ Veritabanı boş - Admin yüklemeli`);
            }
        };
    }
    
    // Admin: Dosya yükle ve index oluştur
    async function uploadAndIndex(file) {
        const statusDiv = document.getElementById('adminStatus');
        const progressFill = document.getElementById('adminProgressFill');
        const progressBar = document.getElementById('adminProgress');
        
        statusDiv.innerHTML = '<div class="alert alert-info">📥 Dosya işleniyor, index oluşturuluyor...</div>';
        progressBar.style.display = 'block';
        
        const CHUNK_SIZE = 20 * 1024 * 1024; // 20MB parçalar
        let offset = 0;
        let tempIndex = new Map();
        
        // Temizle
        const clearTx = db.transaction(["data"], "readwrite");
        clearTx.objectStore("data").clear();
        
        function processChunk() {
            if(offset >= file.size) {
                // Index'i kaydet
                const saveTx = db.transaction(["data"], "readwrite");
                saveTx.objectStore("data").put(JSON.stringify([...tempIndex]), "idIndex");
                saveTx.oncomplete = () => {
                    idIndex = tempIndex;
                    statusDiv.innerHTML = `<div class="alert alert-success">✅ Yüklendi! ${idIndex.size.toLocaleString()} benzersiz ID indekslendi.</div>`;
                    document.getElementById('dbStatus') && (document.getElementById('dbStatus').innerHTML = `✅ ${idIndex.size.toLocaleString()} ID indeksli`);
                    progressBar.style.display = 'none';
                    setTimeout(() => { if(statusDiv) statusDiv.innerHTML = ''; }, 3000);
                };
                return;
            }
            
            const end = Math.min(offset + CHUNK_SIZE, file.size);
            const blob = file.slice(offset, end);
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split('\n');
                
                for(let line of lines) {
                    // ID'yi bul (17-20 haneli sayı)
                    const idMatch = line.match(/\b\d{17,20}\b/);
                    if(idMatch) {
                        const foundId = idMatch[0];
                        if(!tempIndex.has(foundId)) {
                            // Sadece ilk 200 karakteri sakla
                            tempIndex.set(foundId, line.substring(0, 300));
                        }
                    }
                }
                
                const percent = (end / file.size) * 100;
                progressFill.style.width = percent + '%';
                statusDiv.innerHTML = `<div class="alert alert-info">📥 İndeksleniyor: ${Math.round(percent)}% (${tempIndex.size.toLocaleString()} ID bulundu)</div>`;
                
                offset = end;
                setTimeout(processChunk, 10);
            };
            reader.readAsText(blob, "UTF-8");
        }
        
        processChunk();
    }
    
    // Hızlı sorgulama (sadece indeksten bakar)
    async function searchId() {
        const id = document.getElementById('searchId').value.trim();
        const resultDiv = document.getElementById('resultArea');
        
        if(!id) {
            resultDiv.innerHTML = '<div class="alert alert-error">❌ ID girin!</div>';
            return;
        }
        
        if(!idIndex || idIndex.size === 0) {
            resultDiv.innerHTML = '<div class="alert alert-error">⚠️ Veritabanı boş! Admin dosyayı yüklemeli.</div>';
            return;
        }
        
        resultDiv.innerHTML = '<div class="alert alert-info"><span class="loading-spinner"></span> Aranıyor...</div>';
        
        // Mikro gecikme ile UI donmasını engelle
        setTimeout(() => {
            const found = idIndex.get(id);
            if(found) {
                let safeLine = found.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                resultDiv.innerHTML = `<div class="result-box"><h3 style="color:#ff2a2a;">✅ SONUÇ BULUNDU!</h3><p><code>${safeLine}</code></p><hr><p style="font-size:0.7rem;">🔍 ID: ${id}</p></div>`;
            } else {
                resultDiv.innerHTML = '<div class="alert alert-error">❌ Bu ID veritabanında bulunamadı.</div>';
            }
        }, 10);
    }
    
    // Admin Girişi
    function showAdminLogin() {
        const pwd = prompt("🔐 Yönetici Şifresini Girin:");
        if(pwd === ADMIN_PASSWORD) {
            isAdminMode = true;
            showAdminPanel();
        } else if(pwd) {
            alert("❌ Geçersiz şifre!");
        }
    }
    
    function showAdminPanel() {
        if(!isAdminMode) return;
        
        const content = document.getElementById('pageContent');
        content.innerHTML = `
            <h3 style="color:#ff2a2a;">👑 YÖNETİCİ PANELİ</h3>
            <hr>
            <div style="background:rgba(255,42,42,0.1); padding:1rem; border-radius:16px;">
                <h4>📁 VERİTABANI YÜKLE</h4>
                <input type="file" id="adminFile" accept=".txt">
                <div class="progress-bar" id="adminProgress" style="display:none;"><div class="progress-fill" id="adminProgressFill"></div></div>
                <div id="adminStatus"></div>
                <button onclick="adminUpload()">📤 DOSYAYI YÜKLE VE İNDEKSELE</button>
                <button onclick="clearDatabase()" style="background:#ff4444; margin-top:0.5rem;">🗑️ VERİTABANINI TEMİZLE</button>
            </div>
            <hr>
            <div style="background:rgba(255,42,42,0.1); padding:1rem; border-radius:16px;">
                <h4>📊 DURUM</h4>
                <p>📄 İndekslenen ID: <strong>${idIndex.size.toLocaleString()}</strong></p>
                <p>💾 Tarayıcı: ${/Mobile|Android|iPhone/i.test(navigator.userAgent) ? '📱 Mobil' : '💻 Bilgisayar'}</p>
            </div>
            <button onclick="closeAdminPanel()" style="background:#333; margin-top:1rem;">🔒 KAPAT</button>
        `;
        toggleSidebar();
    }
    
    function closeAdminPanel() {
        isAdminMode = false;
        showMain();
    }
    
    window.adminUpload = async function() {
        const fileInput = document.getElementById('adminFile');
        if(!fileInput.files.length) {
            document.getElementById('adminStatus').innerHTML = '<div class="alert alert-error">Dosya seç!</div>';
            return;
        }
        
        const file = fileInput.files[0];
        const sizeMB = (file.size / 1024 / 1024).toFixed(2);
        
        if(file.size > 2 * 1024 * 1024 * 1024) {
            document.getElementById('adminStatus').innerHTML = `<div class="alert alert-error">Max 2GB! Bu dosya ${sizeMB} MB</div>`;
            return;
        }
        
        document.getElementById('adminStatus').innerHTML = `<div class="alert alert-info">📥 ${sizeMB} MB dosya indeksleniyor... Lütfen bekleyin!</div>`;
        
        await uploadAndIndex(file);
    };
    
    window.clearDatabase = async function() {
        if(confirm('⚠️ Tüm veritabanını silmek istediğine emin misin?')) {
            const tx = db.transaction(["data"], "readwrite");
            tx.objectStore("data").clear();
            idIndex.clear();
            document.getElementById('dbStatus') && (document.getElementById('dbStatus').innerHTML = '⚠️ Veritabanı boş');
            alert('✅ Veritabanı temizlendi!');
            showAdminPanel();
        }
    };
    
    // Ana Sayfa
    function showMain() {
        document.getElementById('pageContent').innerHTML = `
            <input type="text" id="searchId" placeholder="Discord ID Girin (Örn: 123456789012345678)">
            <button onclick="searchId()">🔎 SORGULA</button>
            <div id="resultArea"></div>
            <div id="infoArea" class="alert-info" style="margin-top:1rem; padding:0.5rem; text-align:center; font-size:0.7rem;">
                💾 Veritabanı: <span id="dbStatus">${idIndex.size > 0 ? '✅ ' + idIndex.size.toLocaleString() + ' ID indeksli' : '⚠️ Yüklenmedi'}</span>
            </div>
        `;
        toggleSidebar();
    }
    
    function showStats() {
        document.getElementById('pageContent').innerHTML = `
            <h3 style="color:#ff2a2a;">📊 İSTATİSTİKLER</h3>
            <hr>
            <div class="result-box">
                <p>📄 İndekslenen ID: ${idIndex.size.toLocaleString()}</p>
                <p>📅 Tarih: ${new Date().toLocaleString('tr-TR')}</p>
                <p>🌐 Tarayıcı: ${/Mobile|Android|iPhone/i.test(navigator.userAgent) ? 'Mobil' : 'Bilgisayar'}</p>
            </div>
            <button onclick="showMain()" style="margin-top:1rem;">⬅️ GERİ DÖN</button>
        `;
        toggleSidebar();
    }
    
    function toggleSidebar() {
        document.querySelector('.sidebar').classList.toggle('open');
        document.querySelector('.overlay').classList.toggle('active');
    }
    
    // Başlangıç
    initDB();
    showMain();
    
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if(e.ctrlKey && (e.key === 'u' || e.key === 'U')) e.preventDefault();
        if(e.key === 'F12') e.preventDefault();
    });
</script>
</body>
</html>
